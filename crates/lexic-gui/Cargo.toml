[package]
name = "lexic-gui"
version = "1.2.0"
edition = "2024"
description = "Offline-first dictionary + SM-2 flashcard desktop GUI (iced)"
license = "MIT"

[features]
default = ["ui"]
ui = ["dep:iced"]

[dependencies]
lexic-core = { path = "../lexic-core", version = "1.2.0" }
lexic-store = { path = "../lexic-store", version = "1.2.0" }
lexic-dict = { path = "../lexic-dict", version = "1.2.0" }
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "web-colors", "thread-pool", "linux-theme-detection", "x11", "wayland", "tokio", "svg", "image", "canvas", "lazy"], optional = true }
chrono = { workspace = true }
directories = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
iced_fonts = { version = "0.3", default-features = false, features = ["lucide"] }
uuid = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls", "json"] }
serde_json = { workspace = true }
rusqlite = { workspace = true }
rand = { workspace = true }
[lints]
workspace = true

[[bin]]
name = "lexic-gui"
path = "src/main.rs"