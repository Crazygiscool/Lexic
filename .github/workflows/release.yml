name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "Building version ${{ github.ref_name }}"
      - run: echo "Ref type: ${{ github.ref_type }}"
      - run: echo "Ref name: ${{ github.ref_name }}"