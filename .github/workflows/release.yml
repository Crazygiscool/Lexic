name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libgl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p lexic-gui

      - name: Package release asset
        shell: bash
        run: |
          mkdir -p dist
          case "$RUNNER_OS" in
            Linux)
              cp target/release/lexic-gui dist/lexic-linux-x86_64
              tar -czf dist/lexic-linux-x86_64.tar.gz -C dist lexic-linux-x86_64
              rm dist/lexic-linux-x86_64
              ;;
            macOS)
              cp target/release/lexic-gui dist/lexic-macos
              tar -czf dist/lexic-macos.tar.gz -C dist lexic-macos
              rm dist/lexic-macos
              ;;
            Windows)
              cp target/release/lexic-gui.exe dist/lexic-windows-x86_64.exe
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: lexic-${{ runner.os }}
          path: dist/*

  release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lexic-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
