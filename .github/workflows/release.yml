name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libasound2-dev \
            libgl-dev

      - name: Install Linux AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y wget
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install Windows packaging tools
        if: runner.os == 'Windows'
        run: choco install nsis -y --no-progress

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release -p lexic-gui

      - name: Package Linux assets
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/lexic-linux-x86_64
          cp target/release/lexic-gui dist/lexic-linux-x86_64/lexic
          chmod +x dist/lexic-linux-x86_64/lexic
          cp README.md dist/lexic-linux-x86_64/ 2>/dev/null || true
          tar -czf dist/lexic-linux-x86_64.tar.gz -C dist lexic-linux-x86_64
          rm -rf dist/lexic-linux-x86_64

      - name: Package macOS assets
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp target/release/lexic-gui dist/lexic-macos
          chmod +x dist/lexic-macos
          (cd dist && zip lexic-macos.zip lexic-macos)
          rm -f dist/lexic-macos

      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/lexic-gui.exe -DestinationPath dist/lexic-windows.zip

      - name: Build NSIS installer
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          ./scripts/build-nsis.sh ${{ github.ref_name }}
          cp dist/lexic-${{ github.ref_name }}-windows-installer.exe dist/

      - uses: actions/upload-artifact@v4
        with:
          name: lexic-${{ runner.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lexic-*
          merge-multiple: true
          path: release-assets

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  publish-crates:
    name: Publish to crates.io
    needs: build
    if: (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')) && secrets.CARGO_REGISTRY_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-homebrew:
    name: Publish to Homebrew
    needs: build
    if: (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')) && secrets.HOMEBREW_TAP_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish Homebrew formula
        run: ./scripts/publish-homebrew.sh ${{ github.ref_name }}
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  publish-chocolatey:
    name: Publish to Chocolatey
    needs: build
    if: (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')) && secrets.CHOCOLATEY_API_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to Chocolatey
        run: ./scripts/publish-chocolatey.sh ${{ github.ref_name }}
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  publish-aur:
    name: Publish to AUR
    needs: build
    if: (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[release]')) && secrets.AUR_SSH_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish to AUR
        run: ./scripts/publish-aur.sh ${{ github.ref_name }}
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}